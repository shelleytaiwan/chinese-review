<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>總複習－快速問答</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0f1521;--surface:#1a2235;--surface2:#222d42;--border:#2d3d5a;
    --blue:#4a7fd4;--blue-light:#6b9be8;--blue-glow:rgba(74,127,212,0.3);
    --green:#3db87a;--green-glow:rgba(61,184,122,0.25);
    --red:#e05555;--red-glow:rgba(224,85,85,0.25);
    --gold:#f0b429;--gold-glow:rgba(240,180,41,0.25);
    --text:#e8edf5;--text-mid:#8fa3c0;--text-muted:#4d6080;
    /* legacy aliases */
    --ink: #e8edf5;
    --ink-light: #8fa3c0;
    --paper: #1a2235;
    --paper-dark: #0f1521;
    --red-light: rgba(224,85,85,0.2);
    --shadow: rgba(0,0,0,0.4);
  }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    
  }
  .app-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    letter-spacing: 4px;
    color: var(--ink-light);
    margin-bottom: 16px;
  }

  .progress-bar {
    width: min(420px, 92vw);
    height: 5px;
    background: rgba(0,0,0,0.08);
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--red);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .scene {
    perspective: 1200px;
    width: min(420px, 92vw);
    height: 520px;
    margin-bottom: 28px;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    box-shadow: 0 8px 32px var(--shadow), 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    background: var(--paper);
    border: 1px solid rgba(0,0,0,0.08);
  }
  .card-front::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 7px;
    background: var(--red);
    border-radius: 20px 20px 0 0;
  }
  .card-back { transform: rotateY(180deg); }
  .card-back::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 7px;
    background: var(--gold);
    border-radius: 20px 20px 0 0;
  }

  /* Speed selector — top of front card */
  .speed-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
  }
  .speed-label {
    font-size: 20px;
    color: var(--ink-light);
    letter-spacing: 3px;
    margin-bottom: 12px;
    font-family: 'Noto Serif TC', serif;
  }
  .speed-buttons {
    display: flex;
    gap: 10px;
  }
  .speed-btn {
    padding: 10px 18px;
    border-radius: 24px;
    border: 2px solid;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
    background: transparent;
  }
  .speed-btn.slow { border-color: #2980b9; color: #2980b9; }
  .speed-btn.slow:hover, .speed-btn.slow.active { background: #2980b9; color: white; }
  .speed-btn.normal { border-color: #27ae60; color: #27ae60; }
  .speed-btn.normal:hover, .speed-btn.normal.active { background: #27ae60; color: white; }
  .speed-btn.fast { border-color: var(--red); color: var(--red); }
  .speed-btn.fast:hover, .speed-btn.fast.active { background: var(--red); color: white; }

  /* Big ear icon */
  .listen-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    gap: 10px;
  }
  .listen-icon {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: #fce4ec;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
    overflow: hidden;
  }
  .listen-icon:hover { transform: scale(1.06); }
  .listen-icon img {
    width: 160px;
    height: 160px;
    object-fit: cover;
    display: block;
  }
  .listen-icon.playing {
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(233,30,99,0.3); }
    50% { box-shadow: 0 0 0 22px rgba(233,30,99,0); }
  }
  .listen-label {
    font-size: 22px;
    color: var(--red);
    letter-spacing: 3px;
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
  }

  /* Back of card */
  .q-number {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 24px;
  }
  .q-text {
    font-family: 'Noto Serif TC', serif;
    font-size: 32px;
    color: var(--ink);
    text-align: center;
    line-height: 1.7;
    font-weight: 700;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .ctrl-btn {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.15);
    background: var(--paper);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .ctrl-btn:hover { background: var(--ink); border-color: var(--ink); }
  .ctrl-btn:hover svg { stroke: white; }
  .ctrl-btn svg {
    width: 30px;
    height: 30px;
    stroke: var(--ink);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.2s;
  }
  .ctrl-btn.flip-btn { border-color: var(--gold); }
  .ctrl-btn.flip-btn:hover { background: var(--gold); border-color: var(--gold); }
  .ctrl-btn.flip-btn svg { stroke: var(--gold); }
  .ctrl-btn.flip-btn:hover svg { stroke: white; }
  .ctrl-btn.next-btn { width: 90px; height: 90px; border-color: var(--red); }
  .ctrl-btn.next-btn:hover { background: var(--red); border-color: var(--red); }
  .ctrl-btn.next-btn svg { stroke: var(--red); width: 36px; height: 36px; }
  .ctrl-btn.next-btn:hover svg { stroke: white; }
  .btn-label {
    font-size: 17px;
    color: var(--ink-light);
    letter-spacing: 2px;
    text-align: center;
    margin-top: 8px;
  }
  .btn-wrap { display: flex; flex-direction: column; align-items: center; }
  .counter {
    font-size: 20px;
    color: var(--ink-light);
    letter-spacing: 3px;
    margin-top: 20px;
  }
</style>
</head>

<div style="background:#1a2235;border-bottom:1px solid #2d3d5a;padding:14px 20px;display:flex;align-items:center;gap:14px">
  <div>
    <div style="font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:#f0b429">派遣前台灣華語研修</div>
    <div style="font-size:12px;color:#4d6080">總複習</div>
  </div>
</div>

const STORAGE_KEY = 'oralPractice_progress';

let currentIndex = 0;
let isFlipped = false;
let currentSpeed = 'normal';
let isSpeaking = false;

// Load saved progress
function loadProgress() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved !== null) {
      const n = parseInt(saved, 10);
      if (!isNaN(n) && n >= 0 && n < questions.length) {
        currentIndex = n;
        if (n > 0) {
}
      }
    }
  } catch(e) {}
}

function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, currentIndex); } catch(e) {}
}

function setSpeed(speed) {
  currentSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.speed-btn.' + speed).classList.add('active');
}

function updateCard() {
  document.getElementById('qNumber').textContent = '第 ' + (currentIndex + 1) + ' 題';
  document.getElementById('qText').textContent = questions[currentIndex];
  document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + questions.length;
  document.getElementById('progress').style.width = ((currentIndex + 1) / questions.length * 100) + '%';
  saveProgress();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
}

function nextCard() {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  document.getElementById('listenIcon').classList.remove('playing');
  if (currentIndex < questions.length - 1) {
    currentIndex++;
  } else {
    currentIndex = 0;
}
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  updateCard();
}

function playQuestion() {
  if (isSpeaking) {
    window.speechSynthesis.cancel();
    isSpeaking = false;
    document.getElementById('listenIcon').classList.remove('playing');
    return;
  }

  const text = questions[currentIndex];
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-TW';

  const voices = window.speechSynthesis.getVoices();

  // 慢速＋標準：Li-Mu (zh-CN)　自然快速：美佳 (zh-TW)
  const liMu = voices.find(v => v.name === 'Li-Mu')
             || voices.find(v => v.name.includes('Li-Mu'))
             || voices.find(v => v.lang === 'zh-CN');

  const meijia = voices.find(v => v.name === '美佳')
               || voices.find(v => v.name.includes('美佳') || v.name.includes('Meijia'))
               || voices.find(v => v.lang === 'zh-TW');

  if (currentSpeed === 'slow') {
    utter.rate = 0.25;
    utter.pitch = 0.85;
    utter.volume = 1.0;
    utter.voice = liMu || null;
    if (liMu) utter.lang = liMu.lang;
  } else if (currentSpeed === 'normal') {
    utter.rate = 0.8;
    utter.pitch = 1.0;
    utter.volume = 1.0;
    utter.voice = liMu || null;
    if (liMu) utter.lang = liMu.lang;
  } else {
    utter.rate = 1.35;
    utter.pitch = 1.1;
    utter.volume = 0.8;
    utter.voice = meijia || null;
    if (meijia) utter.lang = meijia.lang;
  }

  isSpeaking = true;
  document.getElementById('listenIcon').classList.add('playing');

  utter.onend = () => { isSpeaking = false; document.getElementById('listenIcon').classList.remove('playing'); };
  utter.onerror = () => { isSpeaking = false; document.getElementById('listenIcon').classList.remove('playing'); };

  window.speechSynthesis.speak(utter);
}

window.speechSynthesis.onvoiceschanged = () => {};

loadProgress();
updateCard();
</script>
