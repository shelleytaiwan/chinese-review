<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>總複習－聽數字</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1521;--surface:#1a2235;--surface2:#222d42;--border:#2d3d5a;
  --blue:#4a7fd4;--blue-light:#6b9be8;--blue-glow:rgba(74,127,212,0.3);
  --green:#3db87a;--green-glow:rgba(61,184,122,0.25);
  --red:#e05555;--red-glow:rgba(224,85,85,0.25);
  --gold:#f0b429;
  --text:#e8edf5;--text-mid:#8fa3c0;--text-muted:#4d6080;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;display:flex;flex-direction:column;font-size:18px}

/* ── SITE HEADER ── */
.site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px}
.site-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--gold);flex:1}
.site-sub{font-size:12px;color:var(--text-muted)}

/* ── MAIN ── */
.main{flex:1;display:flex;justify-content:center;align-items:center;padding:32px 20px;background:radial-gradient(ellipse at 30% 20%,rgba(74,127,212,.12) 0%,transparent 60%),var(--bg)}
.card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px 32px;text-align:center}

h1{font-family:'Noto Serif TC',serif;font-size:1.8rem;font-weight:700;color:var(--text);margin-bottom:28px}

.speaker-btn{background:var(--blue-glow);border:1px solid var(--blue);color:var(--blue-light);display:inline-block;padding:16px 40px;border-radius:40px;font-size:1.5rem;font-weight:700;cursor:pointer;margin:0 0 28px;transition:all .15s;letter-spacing:1px}
.speaker-btn:hover{background:var(--blue);color:#fff}
.speaker-btn:active{transform:scale(.96)}

.input-group{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
.answer-input{flex:2;min-width:180px;padding:14px 20px;font-size:1.3rem;border:1px solid var(--border);border-radius:40px;text-align:center;font-weight:500;background:var(--surface2);color:var(--text);font-family:'Noto Sans TC',sans-serif}
.answer-input:focus{border-color:var(--blue);outline:none;background:var(--bg)}
.answer-input::placeholder{color:var(--text-muted)}

.submit-btn{background:var(--blue);border:none;color:#fff;padding:14px 28px;border-radius:40px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}
.submit-btn:hover{background:var(--blue-light)}
.submit-btn:active{transform:scale(.96)}

.feedback{font-size:1.3rem;margin:16px 0;padding:14px 20px;border-radius:40px;font-weight:500;min-height:54px}
.correct-fb{background:var(--green-glow);border:1px solid var(--green);color:var(--green)}
.wrong-fb{background:var(--red-glow);border:1px solid var(--red);color:var(--red)}

.next-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 32px;border-radius:40px;font-size:1.1rem;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;margin-top:8px;transition:all .15s}
.next-btn:hover{border-color:var(--blue);background:var(--surface)}
.next-btn:active{transform:scale(.96)}

.counter{font-size:0.95rem;margin-top:24px;color:var(--text-muted)}
.counter span{color:var(--gold);font-weight:700}
</style>
</head>
<body>

<div class="site-header">
  <div>
    <div class="site-title">派遣前台灣華語研修</div>
    <div class="site-sub">總複習</div>
  </div>
</div>

<div class="main">
  <div class="card">
    <h1>總複習－聽數字</h1>

    <div class="speaker-btn" id="speakerBtn">🔊 朗讀題目</div>

    <div class="input-group">
      <input type="text" id="userAnswer" class="answer-input" placeholder="請輸入數字" autocomplete="off" inputmode="numeric">
      <button class="submit-btn" id="submitBtn">答案</button>
    </div>

    <div class="feedback" id="feedbackMsg"></div>

    <button class="next-btn" id="nextBtn">下一題</button>

    <div class="counter">
      已答 <span id="answeredCount">0</span> 題・正確 <span id="correctCount">0</span> 題
    </div>
  </div>
</div>

<script>
const measureWords = ['位','個','條','本','杯','塊','盤','份','斤','盒','箱','粒'];
const phoneNumbers = ['08038622941','035214985','0225971564'];

function getRandomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randomMoney(){return getRandomInt(10,99999);}

function formatYearForSpeech(year){
  const s=year.toString();let r='';
  for(let i=0;i<s.length;i++){r+=['零','一','二','三','四','五','六','七','八','九'][parseInt(s[i])];}
  return r+'年';
}
function formatPhoneForSpeech(phone){
  const d=phone.toString();let r='';
  for(let i=0;i<d.length;i++){
    r+=['零','一','二','三','四','五','六','七','八','九'][parseInt(d[i])];
    if(i===3&&d.length>5)r+=' ';
  }
  return r;
}

function generateRandomQuestion(){
  const r=Math.random();
  if(r<0.2){
    const phone=phoneNumbers[Math.floor(Math.random()*phoneNumbers.length)];
    return{type:'phone',displayText:phone,answerNum:phone,speechText:formatPhoneForSpeech(phone)};
  }else if(r<0.5){
    const year=getRandomInt(1950,2026);
    return{type:'year',displayText:year.toString(),answerNum:year,speechText:formatYearForSpeech(year)};
  }else if(r<0.8){
    const money=randomMoney();
    return{type:'money',displayText:money.toString(),answerNum:money,speechText:money+'元'};
  }else{
    let number;
    const rs=Math.random();
    if(rs<0.7)number=getRandomInt(1,99);
    else if(rs<0.9)number=getRandomInt(100,999);
    else number=getRandomInt(1000,5000);
    const measure=measureWords[Math.floor(Math.random()*measureWords.length)];
    return{type:'measure',displayText:number.toString(),answerNum:number,speechText:number+measure};
  }
}

let totalAnswered=0,totalCorrect=0,currentQuestion=null,isCurrentCorrect=false;

function loadProgress(){
  const a=localStorage.getItem('listenNum_answered'),c=localStorage.getItem('listenNum_correct');
  if(a!==null)totalAnswered=parseInt(a,10);
  if(c!==null)totalCorrect=parseInt(c,10);
  if(isNaN(totalAnswered))totalAnswered=0;
  if(isNaN(totalCorrect))totalCorrect=0;
  updateCounterUI();
}
function saveProgress(){
  localStorage.setItem('listenNum_answered',totalAnswered);
  localStorage.setItem('listenNum_correct',totalCorrect);
}
function updateCounterUI(){
  document.getElementById('answeredCount').innerText=totalAnswered;
  document.getElementById('correctCount').innerText=totalCorrect;
}
function loadNewQuestion(){
  currentQuestion=generateRandomQuestion();
  document.getElementById('userAnswer').value='';
  isCurrentCorrect=false;
  const fb=document.getElementById('feedbackMsg');
  fb.innerHTML='';fb.className='feedback';
}
function speakCurrentQuestion(){
  if(!currentQuestion)loadNewQuestion();
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(currentQuestion.speechText);
    u.lang='zh-TW';u.rate=0.85;
    window.speechSynthesis.speak(u);
  }
}
function checkAnswer(){
  if(!currentQuestion)loadNewQuestion();
  if(isCurrentCorrect){
    const fb=document.getElementById('feedbackMsg');
    fb.innerHTML='✅ 這題已經答對了！按下一題繼續！';
    fb.className='feedback correct-fb';return;
  }
  const inputVal=document.getElementById('userAnswer').value.trim();
  if(inputVal===''){
    const fb=document.getElementById('feedbackMsg');
    fb.innerHTML='請輸入數字';fb.className='feedback wrong-fb';return;
  }
  let isCorrect=false;
  if(currentQuestion.type==='phone'){
    isCorrect=(inputVal===currentQuestion.answerNum);
  }else{
    const n=Number(inputVal);
    if(isNaN(n)){
      const fb=document.getElementById('feedbackMsg');
      fb.innerHTML='請輸入數字';fb.className='feedback wrong-fb';return;
    }
    isCorrect=(n===currentQuestion.answerNum);
  }
  const fb=document.getElementById('feedbackMsg');
  if(isCorrect){
    isCurrentCorrect=true;totalAnswered++;totalCorrect++;
    updateCounterUI();saveProgress();
    fb.innerHTML='✅ 答對了，好棒！';fb.className='feedback correct-fb';
  }else{
    fb.innerHTML='❌ 不對哦！再一次。';fb.className='feedback wrong-fb';
  }
}
function init(){
  loadProgress();loadNewQuestion();
  document.getElementById('speakerBtn').onclick=()=>speakCurrentQuestion();
  document.getElementById('submitBtn').onclick=()=>checkAnswer();
  document.getElementById('nextBtn').onclick=()=>loadNewQuestion();
  document.getElementById('userAnswer').addEventListener('keypress',e=>{if(e.key==='Enter')checkAnswer();});
}
init();
</script>
</body>
</html>
