<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>總複習－詞語</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1521;--surface:#1a2235;--surface2:#222d42;--border:#2d3d5a;
  --blue:#4a7fd4;--blue-light:#6b9be8;--blue-glow:rgba(74,127,212,0.3);
  --green:#3db87a;--green-glow:rgba(61,184,122,0.25);
  --red:#e05555;--red-glow:rgba(224,85,85,0.25);
  --gold:#f0b429;--gold-glow:rgba(240,180,41,0.25);
  --text:#e8edf5;--text-mid:#8fa3c0;--text-muted:#4d6080;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-weight:400;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;font-size:18px}

/* ── SITE HEADER ── */
.site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px}
.site-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--gold);flex:1}
.site-sub{font-size:12px;color:var(--text-muted)}

/* ── MENU SCREEN ── */
#screen-menu{display:flex;flex-direction:column;align-items:center;gap:48px;padding:48px 20px;flex:1;background:radial-gradient(ellipse at 30% 20%,rgba(74,127,212,.12) 0%,transparent 60%),var(--bg)}
.menu-title h2{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px}
.menu-title p{font-size:14px;color:var(--text-muted);text-align:center}
.menu-btns{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.menu-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 48px;font-family:'Noto Sans TC',sans-serif;font-size:22px;font-weight:700;color:var(--text);cursor:pointer;transition:all .2s;text-align:center;min-width:180px}
.menu-btn:hover{border-color:var(--blue);background:var(--surface2);transform:translateY(-3px);box-shadow:0 8px 24px var(--blue-glow)}
.menu-btn:active{transform:scale(.97)}
.menu-btn .btn-icon{font-size:36px;display:block;margin-bottom:10px}

/* ── MARQUEE SCREEN ── */
#screen-marquee{display:none;flex-direction:column;flex:1}

/* ── GAME HEADER ── */
.game-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.back-btn{background:none;border:none;color:var(--text-mid);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:all .15s}
.back-btn:hover{color:var(--text);background:var(--surface2)}
.game-title{font-size:17px;font-weight:500;flex:1}
.progress-bar{height:5px;background:var(--border);border-radius:3px;flex:1;overflow:hidden;min-width:40px}
.progress-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .4s}
.score-badge{background:var(--surface2);border:1px solid var(--border);color:var(--gold);font-size:14px;padding:5px 12px;border-radius:20px;white-space:nowrap}

/* ── STAGE ── */
.stage{flex:1;position:relative;overflow:hidden;background:var(--surface);margin:20px;border-radius:20px;border:1px solid var(--border);min-height:200px}
.lesson-tag{position:absolute;top:14px;left:16px;background:var(--blue-glow);border:1px solid var(--blue);color:var(--blue-light);font-size:12px;font-weight:700;padding:4px 13px;border-radius:20px;letter-spacing:1px;pointer-events:none;z-index:2}
#marquee-el{position:absolute;top:50%;white-space:nowrap;font-weight:900;pointer-events:none;will-change:transform;visibility:hidden}
#marquee-el.mode-pinyin{font-size:5.5rem;letter-spacing:6px;color:var(--blue-light)}
#marquee-el.mode-word{font-size:6.5rem;letter-spacing:10px;color:var(--text);font-family:'Noto Serif TC',serif}

/* ── BOTTOM BAR ── */
.bottombar{flex-shrink:0;padding:16px 20px 24px;display:flex;align-items:center;justify-content:center;gap:20px}
.hp-btn{display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:50%;width:80px;height:80px;font-size:28px;transition:all .2s;flex-shrink:0}
.hp-btn:hover{border-color:var(--blue);background:var(--surface2);transform:translateY(-3px);box-shadow:0 8px 20px var(--blue-glow)}
.hp-btn:active{transform:scale(.92)}
.next-btn{background:var(--blue);border:none;border-radius:40px;height:80px;padding:0 48px;font-size:1.5rem;color:#fff;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:700;letter-spacing:2px;flex-shrink:0;white-space:nowrap;transition:all .2s}
.next-btn:hover:not(:disabled){background:var(--blue-light);transform:translateY(-3px);box-shadow:0 8px 20px var(--blue-glow)}
.next-btn:active:not(:disabled){transform:scale(.96)}
.next-btn:disabled{opacity:.3;cursor:not-allowed}

/* ── DONE SCREEN ── */
#screen-done{display:none;flex-direction:column;align-items:center;gap:24px;padding:48px 20px;text-align:center;flex:1;background:radial-gradient(ellipse at 30% 20%,rgba(61,184,122,.1) 0%,transparent 60%),var(--bg)}
.done-emoji{font-size:5rem}
.done-h{font-family:'Noto Serif TC',serif;font-size:2rem;font-weight:700;color:var(--text)}
.done-sub{color:var(--text-mid)}
.done-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.done-btn{background:var(--blue);color:#fff;border:none;border-radius:40px;padding:14px 36px;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .2s}
.done-btn:hover{background:var(--blue-light);transform:translateY(-2px)}
.done-btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.done-btn.sec:hover{background:var(--surface2);border-color:var(--blue)}
</style>
</head>
<body>

<div class="site-header">
  <div>
    <div class="site-title">派遣前台灣華語研修</div>
    <div class="site-sub">總複習－詞語</div>
  </div>
</div>

<!-- MENU -->
<div id="screen-menu">
  <div class="menu-title">
    <h2>總複習－詞語</h2>
    <p>419 個詞語・跑馬燈練習</p>
  </div>
  <div class="menu-btns">
    <button class="menu-btn" onclick="startMode('pinyin')">拼音</button>
    <button class="menu-btn" onclick="startMode('word')">詞語</button>
  </div>
</div>

<!-- MARQUEE -->
<div id="screen-marquee">
  <div class="game-header">
    <button class="back-btn" onclick="goMenu()">←</button>
    <div class="game-title" id="mode-label">拼音</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="score-badge" id="counter">1 / 419</div>
  </div>

  <div class="stage" id="stage">
    <div class="lesson-tag" id="lesson-tag">D1</div>
    <div id="marquee-el"></div>
  </div>

  <div class="bottombar">
    <button class="hp-btn" onclick="speakCurrent()" title="聽發音">🔊</button>
    <button class="next-btn" id="next-btn" onclick="doNext()" disabled>下一個 ↓</button>
  </div>
</div>

<!-- DONE -->
<div id="screen-done">
  <div class="done-emoji">🎉</div>
  <div class="done-h">完成了！</div>
  <div class="done-sub">全部 419 個詞語都練習完畢</div>
  <div class="done-btns">
    <button class="done-btn" onclick="restartSame()">再練一次</button>
    <button class="done-btn sec" onclick="goMenu()">回選單</button>
  </div>
</div>

const SPEED = 4000;
let mode = 'pinyin';
let idx  = 0;
let canNext = false;
let animId  = null;

function saveIdx() { try { localStorage.setItem('mq3_'+mode, idx); } catch(e){} }
function loadIdx() { try { const v=localStorage.getItem('mq3_'+mode); return v!=null?Math.max(0,Math.min(+v,CARDS.length-1)):0; } catch(e){return 0;} }

function show(id) {
  ['screen-menu','screen-marquee','screen-done'].forEach(s =>
    document.getElementById(s).style.display = s===id ? 'flex' : 'none');
}
function goMenu() {
  if (animId) { cancelAnimationFrame(animId); animId=null; }
  show('screen-menu');
}
function startMode(m) {
  mode = m; idx = loadIdx();
  document.getElementById('mode-label').textContent = m==='pinyin'?'拼音':'詞語';
  show('screen-marquee');
  launchCurrent();
}
function restartSame() { idx=0; show('screen-marquee'); launchCurrent(); }

function launchCurrent() {
  if (idx >= CARDS.length) { showDone(); return; }
  const card    = CARDS[idx];
  const el      = document.getElementById('marquee-el');
  const stage   = document.getElementById('stage');
  const nextBtn = document.getElementById('next-btn');
  document.getElementById('lesson-tag').textContent   = 'D' + card.lesson;
  document.getElementById('counter').textContent       = (idx+1) + ' / ' + CARDS.length;
  document.getElementById('progress-fill').style.width = ((idx+1)/CARDS.length*100) + '%';
  el.textContent = mode==='pinyin' ? card.pinyin : card.word;
  el.className   = 'mode-' + mode;
  nextBtn.disabled = true;
  canNext = false;
  if (animId) { cancelAnimationFrame(animId); animId=null; }
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const stageW = stage.offsetWidth;
    const elW    = el.offsetWidth;
    const startX = stageW;
    const endX   = -(elW + 60);
    const startTime = performance.now();
    el.style.visibility = 'visible';
    function tick(now) {
      const t = Math.min((now - startTime) / SPEED, 1);
      el.style.transform = 'translateY(-50%) translateX(' + (startX + (endX - startX) * t) + 'px)';
      if (t < 1) {
        animId = requestAnimationFrame(tick);
      } else {
        el.style.visibility = 'hidden';
        animId = null;
        canNext = true;
        nextBtn.disabled = false;
      }
    }
    animId = requestAnimationFrame(tick);
  }));
  saveIdx();
}

function doNext() {
  if (!canNext) return;
  canNext = false;
  if (idx >= CARDS.length-1) { showDone(); return; }
  idx++;
  launchCurrent();
}

function speakCurrent() {
  if (idx >= CARDS.length) return;
  const utter = new SpeechSynthesisUtterance(CARDS[idx].word);
  utter.lang = 'zh-TW'; utter.rate = 0.82;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang==='zh-TW') || voices.find(v=>v.lang.startsWith('zh'));
  if (v) utter.voice = v;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}
window.speechSynthesis.onvoiceschanged = ()=>{};

function showDone() {
  try { localStorage.removeItem('mq3_'+mode); } catch(e){}
  show('screen-done');
}

document.addEventListener('keydown', e => {
  if (document.getElementById('screen-marquee').style.display !== 'flex') return;
  if ((e.key==='ArrowDown'||e.key===' '||e.key==='ArrowRight') && canNext) {
    e.preventDefault(); doNext();
  }
  if (e.key==='Enter') speakCurrent();
});
</script>
