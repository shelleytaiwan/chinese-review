<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>派遣前台灣華語研修</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1521;--surface:#1a2235;--surface2:#222d42;--border:#2d3d5a;
  --blue:#4a7fd4;--blue-light:#6b9be8;--blue-glow:rgba(74,127,212,0.3);
  --green:#3db87a;--green-glow:rgba(61,184,122,0.25);
  --red:#e05555;--red-glow:rgba(224,85,85,0.25);
  --gold:#f0b429;--gold-glow:rgba(240,180,41,0.25);
  --text:#e8edf5;--text-mid:#8fa3c0;--text-muted:#4d6080;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-weight:400;min-height:100vh;overflow-x:hidden;font-size:18px}

/* ── SITE HEADER ── */
.site-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.site-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--gold);flex:1}
.site-sub{font-size:12px;color:var(--text-muted)}

/* ── SCREENS ── */
.screen{display:none;min-height:calc(100vh - 57px);flex-direction:column}
.screen.active{display:flex}

/* ── PORTAL (課次選單) ── */
#portal{background:radial-gradient(ellipse at 30% 20%,rgba(74,127,212,.12) 0%,transparent 60%),var(--bg);padding:32px 20px;align-items:center}
.portal-heading{text-align:center;margin-bottom:28px}
.portal-heading h2{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:700;margin-bottom:6px}
.portal-heading p{font-size:14px;color:var(--text-muted)}
.lessons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:100%;max-width:600px}
.lesson-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 14px;cursor:pointer;transition:all .2s;text-align:center}
.lesson-card:hover:not(.locked){border-color:var(--blue);background:var(--surface2);transform:translateY(-2px)}
.lesson-card.locked{opacity:.35;cursor:default}
.lesson-card.pinyin-card{border-color:var(--border);background:var(--surface)}
.lesson-card.pinyin-card:hover{border-color:var(--blue);background:var(--surface2);transform:translateY(-2px)}
.lesson-card .d-num{font-size:13px;font-family:monospace;color:var(--blue-light);margin-bottom:6px;letter-spacing:1px}
.lesson-card .d-title{font-size:14px;font-weight:500;line-height:1.4}
.portal-credit{margin-top:32px;font-size:12px;color:var(--text-muted);text-align:center;line-height:2}

/* ── LESSON HOME ── */
#lesson-home{background:radial-gradient(ellipse at 30% 20%,rgba(74,127,212,.12) 0%,transparent 60%),var(--bg);padding:28px 20px;align-items:center}
.lesson-home-header{text-align:center;margin-bottom:28px;width:100%;max-width:460px}
.lesson-badge{display:inline-block;background:var(--blue-glow);border:1px solid var(--blue);color:var(--blue-light);font-size:12px;letter-spacing:3px;padding:5px 16px;border-radius:20px;margin-bottom:14px;cursor:pointer}
.lesson-badge:hover{background:var(--blue);color:#fff}
.lesson-title{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:700;line-height:1.4;margin-bottom:6px}
.lesson-title span{color:var(--blue-light)}
.lesson-info{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:460px;margin-bottom:22px;font-size:14px;color:var(--text-mid);line-height:1.8}
.modes-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:460px}
.mode-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 14px;cursor:pointer;transition:all .2s;text-align:center;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center}
.mode-btn:hover{border-color:var(--blue);background:var(--surface2);transform:translateY(-2px)}
.mode-btn.tone-btn{background:var(--surface);border-color:var(--border)}
.mode-btn.tone-btn:hover{background:var(--surface2);border-color:var(--blue);transform:translateY(-2px)}
.mode-icon{font-size:36px;margin-bottom:10px}
.mode-name{font-size:20px;font-weight:700;margin-bottom:0}
.mode-desc{display:none}

/* ── GAME HEADER ── */
.game-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:57px;z-index:50}
.back-btn{background:none;border:none;color:var(--text-mid);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px;transition:all .15s}
.back-btn:hover{color:var(--text);background:var(--surface2)}
.game-title{font-size:17px;font-weight:500;flex:1}
.progress-bar{height:5px;background:var(--border);border-radius:3px;flex:1;overflow:hidden;min-width:40px}
.progress-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .4s}
.score-badge{background:var(--surface2);border:1px solid var(--border);color:var(--gold);font-size:14px;padding:5px 12px;border-radius:20px;white-space:nowrap}
.game-body{padding:24px 18px;max-width:520px;margin:0 auto;width:100%;flex:1}

/* ── FLASHCARDS ── */
.fc-counter{text-align:center;font-size:13px;color:var(--text-muted);margin-bottom:16px;letter-spacing:1px}
.fc-wrap{perspective:1000px;margin-bottom:18px}
.fc-card{width:100%;height:250px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);cursor:pointer}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:24px}
.fc-back{transform:rotateY(180deg);background:var(--surface2);border-color:var(--blue)}
.fc-hint{font-size:12px;letter-spacing:2px;color:var(--text-muted);margin-bottom:10px}
.fc-char{font-family:'Noto Serif TC',serif;font-size:52px;font-weight:700;color:var(--text);margin-bottom:6px;text-align:center;line-height:1.2}
.fc-pinyin{font-size:19px;color:var(--blue-light);margin-bottom:4px;letter-spacing:1px}
.fc-meaning{font-size:17px;color:var(--text-mid);text-align:center}
.fc-example{font-size:14px;color:var(--text-muted);margin-top:8px;text-align:center;line-height:1.7}
.fc-sound-row{display:flex;justify-content:center;margin-bottom:16px}
.fc-sound-btn{background:var(--blue-glow);border:1px solid var(--blue);color:var(--blue-light);border-radius:50%;width:52px;height:52px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.fc-sound-btn:hover{background:var(--blue);color:#fff}
.fc-sound-btn.playing{animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 var(--blue-glow)}to{box-shadow:0 0 0 12px transparent}}
.fc-controls{display:flex;gap:12px;justify-content:center}
.fc-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:12px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.fc-btn.next{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── MEMORY ── */
.mm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.mm-tile{aspect-ratio:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .2s;text-align:center;padding:6px;line-height:1.4;position:relative;overflow:hidden}
.mm-tile::before{content:'';position:absolute;inset:0;background:var(--surface2);transition:opacity .25s;opacity:1}
.mm-tile.revealed::before,.mm-tile.matched::before{opacity:0}
.mm-tile.matched{border-color:var(--green);background:rgba(61,184,122,.1)}
.mm-tile.wrong{border-color:var(--red);animation:shake .3s}
.mm-tile-inner{position:relative;z-index:1;font-size:15px}
.mm-tile:hover:not(.matched){border-color:var(--blue)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mm-stats{display:flex;justify-content:space-between;font-size:14px;color:var(--text-mid);margin-bottom:16px}

/* ── TONE QUIZ (gold theme) ── */
.tq-char-box{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center;margin-bottom:16px}
.tq-char{font-family:'Noto Serif TC',serif;font-size:68px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:4px}
.tq-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tq-btn{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 10px;font-size:17px;color:var(--text);cursor:pointer;transition:all .15s;text-align:center;font-family:'Noto Sans TC',sans-serif;letter-spacing:1px}
.tq-btn:hover:not(:disabled){border-color:var(--gold);background:rgba(240,180,41,0.08)}
.tq-btn.correct{background:var(--green-glow);border-color:var(--green);color:#7de8b0}
.tq-btn.wrong{background:var(--red-glow);border-color:var(--red);color:#ff8a8a}
.tq-submit{background:var(--gold);color:#1a1000;border:none;border-radius:12px;padding:15px;width:100%;font-size:16px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:700}
.tq-submit:disabled{opacity:.4;cursor:default}

/* ── NUMBER DICTATION (inside tone quiz screen) ── */
.nd-card{background:rgba(240,180,41,0.08);border:2px solid var(--gold);border-radius:20px;padding:32px 24px;text-align:center;margin-bottom:18px;cursor:pointer;position:relative}
.nd-question{font-size:22px;color:var(--gold);font-weight:700;margin-bottom:8px;letter-spacing:4px}
.nd-hint{font-size:12px;color:var(--text-muted);letter-spacing:2px}
.nd-answer{font-size:28px;font-weight:700;color:var(--text);display:none;margin-top:12px}
.nd-pinyin{font-size:16px;color:var(--blue-light);margin-top:6px;display:none}
.nd-sound-row{display:flex;justify-content:center;gap:12px;margin-bottom:16px}
.nd-btn-row{display:flex;gap:10px;margin-bottom:10px}
.nd-btn{background:rgba(240,180,41,0.12);border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;flex:1;transition:all .15s}
.nd-btn:hover{background:rgba(240,180,41,0.25)}
.nd-counter{font-size:12px;color:var(--text-muted);text-align:center;letter-spacing:1px;margin-bottom:10px}
.nd-mode-tabs{display:flex;gap:10px;margin-bottom:20px}
.nd-tab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-mid);font-size:14px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;text-align:center;transition:all .15s}
.nd-tab.active{border-color:var(--gold);background:rgba(240,180,41,0.1);color:var(--gold)}

/* ── DIALOGUE ── */
.df-prompt{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;font-size:19px;color:var(--text);margin-bottom:16px;line-height:1.8;text-align:center}
.df-label{font-size:12px;color:var(--text-muted);letter-spacing:2px;display:block;margin-bottom:8px}
.df-choices{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.df-choice{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:16px 18px;font-size:18px;cursor:pointer;transition:all .2s;text-align:center;font-family:'Noto Sans TC',sans-serif;color:var(--text)}
.df-choice:hover:not(.disabled){border-color:var(--blue);background:var(--surface2)}
.df-choice.correct{background:var(--green-glow);border-color:var(--green);color:#7de8b0}
.df-choice.wrong{background:var(--red-glow);border-color:var(--red);color:#ff8a8a}
.df-choice.disabled{cursor:default}
.df-feedback{border-radius:12px;padding:14px 16px;font-size:15px;margin-top:10px;line-height:1.7;display:none}
.df-feedback.correct{background:var(--green-glow);border:1px solid var(--green);color:var(--green)}
.df-feedback.wrong{background:var(--red-glow);border:1px solid var(--red);color:#ff8a8a}

/* ── SENTENCE ── */
.s2-prompt{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;font-size:18px;color:var(--text);margin-bottom:16px;line-height:1.8}
.s2-answer-area{min-height:72px;background:var(--surface);border:2px dashed var(--border);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;transition:border-color .2s}
.s2-answer-area.has-content{border-color:var(--blue)}
.s2-tile{background:var(--blue);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;user-select:none;text-align:center}
.s2-tile .tile-cn{font-size:17px;font-weight:500}
.s2-tile .tile-py{font-size:10px;opacity:.8;margin-top:2px}
.s2-bank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.s2-bank-tile{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;cursor:pointer;user-select:none;text-align:center}
.s2-bank-tile .tile-cn{font-size:17px;font-weight:500}
.s2-bank-tile .tile-py{font-size:10px;color:var(--text-muted);margin-top:2px}
.s2-bank-tile:hover:not(.used){border-color:var(--blue)}
.s2-bank-tile.used{opacity:.25;pointer-events:none}
.s2-actions{display:flex;gap:10px}
.s2-check{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:13px 24px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;flex:1}
.s2-clear{background:var(--surface2);color:var(--text-mid);border:1px solid var(--border);border-radius:10px;padding:13px 18px;font-size:15px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.s2-feedback{border-radius:10px;padding:14px 16px;font-size:15px;margin-top:12px;line-height:1.8;display:none}
.s2-feedback.correct{background:var(--green-glow);border:1px solid var(--green);color:var(--green)}
.s2-feedback.wrong{background:var(--red-glow);border:1px solid var(--red);color:#ff8a8a}

/* ── RESULT ── */
.result-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.result-circle{width:130px;height:130px;border-radius:50%;background:var(--surface);border:3px solid var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 0 40px var(--blue-glow)}
.result-score{font-size:40px;font-weight:700;color:var(--blue-light)}
.result-total{font-size:13px;color:var(--text-muted)}
.result-msg{font-size:22px;font-weight:500;margin-bottom:8px}
.result-sub{font-size:14px;color:var(--text-mid);margin-bottom:32px}
.result-btns{display:flex;flex-direction:column;gap:11px;width:100%;max-width:280px}
.result-retry{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.result-home{background:var(--surface);color:var(--text-mid);border:1px solid var(--border);border-radius:12px;padding:15px;font-size:16px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}

/* ── PINYIN CHART ── */
#pinyin-chart{background:var(--bg);overflow:auto}
.py-chart-wrap{padding:20px 10px;max-width:100%;overflow-x:auto}
.py-table{border-collapse:collapse;min-width:700px;font-size:13px}
.py-table th,.py-table td{border:1px solid var(--border);padding:6px 8px;text-align:center;min-width:42px}
.py-table thead th{background:#0d3a4a;color:#4dd8f0;font-weight:600;font-size:12px;letter-spacing:.5px}
.py-table tbody td:first-child{background:#0d3a4a;color:#4dd8f0;font-weight:600;font-size:12px}
.py-cell{cursor:pointer;border-radius:6px;padding:4px 2px;transition:background .15s;position:relative}
.py-cell:hover{background:rgba(74,127,212,.25)}
.py-cell.empty{cursor:default;color:transparent}
/* tone popup */
.tone-popup{position:fixed;background:var(--surface2);border:2px solid var(--gold);border-radius:16px;padding:18px 22px;z-index:999;box-shadow:0 8px 40px rgba(0,0,0,.6);min-width:220px;display:none}
.tone-popup h3{font-size:18px;color:var(--gold);margin-bottom:12px;text-align:center}
.tone-popup .tone-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tone-pill{background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:8px 16px;font-size:16px;cursor:pointer;color:var(--text);transition:all .15s;letter-spacing:1px}
.tone-pill:hover{border-color:var(--blue);background:var(--blue-glow);color:var(--blue-light)}
.tone-popup-close{position:absolute;top:8px;right:12px;background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer}
.py-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--text-muted);margin-bottom:12px;padding:0 10px}

.q-num{font-size:12px;color:var(--text-muted);letter-spacing:2px;margin-bottom:14px}
/* ── EMOJI MEMORY ── */
.mm-tile-emoji{font-size:32px;line-height:1}
.mm-tile-cn{font-size:16px;font-weight:600;margin-top:2px}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
</style>
</head>
<body>

<!-- SITE HEADER -->
<div class="site-header">
  <div>
    <div class="site-title">派遣前台灣華語研修</div>
    <div class="site-sub" style="color:#ffffff;font-weight:500">解麗琪老師 &amp; 張月珍老師　使用 AI 製作</div>
  </div>
</div>

<!-- PORTAL 課次選單 -->
<div class="screen active" id="portal">
  <div class="portal-heading">
    <h2>選擇課次</h2>
    <p>點擊課次開始練習</p>
  </div>
  <div class="lessons-grid" id="lessons-grid"></div>
  <div class="portal-credit">漢語拼音表 ＋ D1～D22　共 22 課</div>
</div>

<!-- LESSON HOME -->
<div class="screen" id="lesson-home">
  <div style="padding:28px 20px;display:flex;flex-direction:column;align-items:center;flex:1;background:radial-gradient(ellipse at 30% 20%,rgba(74,127,212,.12) 0%,transparent 60%),var(--bg)">
    <div class="lesson-home-header">
      <div class="lesson-badge" onclick="showPortal()">← 所有課次</div>
      <h1 class="lesson-title" id="lh-title"></h1>
    </div>
    <div class="lesson-info" id="lh-info"></div>
    <div class="modes-grid" id="lh-modes"></div>
  </div>
</div>

<!-- FLASHCARDS -->
<div class="screen" id="flashcards">
  <div class="game-header">
    <button class="back-btn" onclick="backToLesson()">←</button>
    <span class="game-title">🃏 詞語卡</span>
    <div class="progress-bar"><div class="progress-fill" id="fc-progress"></div></div>
  </div>
  <div class="game-body">
    <div class="fc-counter" id="fc-counter"></div>
    <div class="fc-wrap">
      <div class="fc-card" id="fc-card" onclick="flipCard()">
        <div class="fc-front">
          <div class="fc-hint">點擊翻轉</div>
          <div class="fc-char" id="fc-char"></div>
        </div>
        <div class="fc-back">
          <div class="fc-pinyin" id="fc-pinyin"></div>
          <div class="fc-meaning" id="fc-meaning"></div>
          <div class="fc-example" id="fc-example"></div>
        </div>
      </div>
    </div>
    <div class="fc-sound-row"><button class="fc-sound-btn" id="fc-sound-btn" onclick="speakWord()">🔊</button></div>
    <div class="fc-controls">
      <button class="fc-btn" onclick="fcPrev()">← 上一張</button>
      <button class="fc-btn next" onclick="fcNext()">下一張 →</button>
    </div>
  </div>
</div>

<!-- MEMORY -->
<div class="screen" id="memory">
  <div class="game-header">
    <button class="back-btn" onclick="backToLesson()">←</button>
    <span class="game-title">🧩 配對遊戲</span>
    <div class="score-badge" id="mm-score-badge">0 配對</div>
  </div>
  <div class="game-body">
    <div class="mm-stats">
      <span id="mm-pairs">配對：0 / 8</span>
      <span id="mm-moves">步數：0</span>
      <span id="mm-timer">⏱ 0s</span>
    </div>
    <div class="mm-grid" id="mm-grid"></div>
  </div>
</div>

<!-- TONE QUIZ + NUMBER DICTATION -->
<div class="screen" id="tonequiz">
  <div class="game-header">
    <button class="back-btn" onclick="backToLesson()">←</button>

const D3_FIXED_NUMBERS = [95,15,47,57,62,26,12,35,96,99,17];
const D3_FIXED_PHONES  = ['080-38652879','090-57612943','03-82459955','02-43795517'];

const _ones=['零','一','二','三','四','五','六','七','八','九'];
const _onesPy=['líng','yī','èr','sān','sì','wǔ','liù','qī','bā','jiǔ'];

function numToCharFixed(n){
  if(n===0) return '零';
  if(n<10) return _ones[n];
  if(n<100){
    const t=Math.floor(n/10),u=n%10;
    return (t===1?'十':_ones[t]+'十')+(u?_ones[u]:'');
  }
  if(n<1000){
    const h=Math.floor(n/100),rest=n%100;
    let s=_ones[h]+'百';
    if(rest===0) return s;
    if(rest<10) s+='零';
    s+=numToCharFixed(rest);
    return s;
  }
  if(n<10000){
    const q=Math.floor(n/1000),rest=n%1000;
    let s=_ones[q]+'千';
    if(rest===0) return s;
    if(rest<100) s+='零';
    s+=numToCharFixed(rest);
    return s;
  }
  // 萬
  const w=Math.floor(n/10000),rest=n%10000;
  let s=_ones[w]+'萬';
  if(rest===0) return s;
  if(rest<1000) s+='零';
  s+=numToCharFixed(rest);
  return s;
}
function numToChar(n){ return numToCharFixed(n); }

function numToPinyin(n){
  if(n===0) return 'líng';
  if(n<10) return _onesPy[n];
  if(n<100){
    const t=Math.floor(n/10),u=n%10;
    return (t===1?'shí':_onesPy[t]+' shí')+(u?' '+_onesPy[u]:'');
  }
  if(n<1000){
    const h=Math.floor(n/100),rest=n%100;
    let s=_onesPy[h]+' bǎi';
    if(rest===0) return s;
    if(rest<10) s+=' líng';
    return s+' '+numToPinyin(rest);
  }
  if(n<10000){
    const q=Math.floor(n/1000),rest=n%1000;
    let s=_onesPy[q]+' qiān';
    if(rest===0) return s;
    if(rest<100) s+=' líng';
    return s+' '+numToPinyin(rest);
  }
  const w=Math.floor(n/10000),rest=n%10000;
  let s=_onesPy[w]+' wàn';
  if(rest===0) return s;
  if(rest<1000) s+=' líng';
  return s+' '+numToPinyin(rest);
}

function phoneDigitsToPinyin(s){
  const map={'0':'líng','1':'yī','2':'èr','3':'sān','4':'sì','5':'wǔ','6':'liù','7':'qī','8':'bā','9':'jiǔ','-':' - '};
  return s.split('').map(ch=>map[ch]||ch).join(' ');
}

// D4 big numbers: 3 hundreds, 3 thousands, 3 ten-thousands (emphasise 5/9)
function generateD4BigNumbers(){
  function randWith59(min,max){
    let n; let tries=0;
    do{ n=min+Math.floor(Math.random()*(max-min+1)); tries++; }
    while(tries<20 && !String(n).includes('5') && !String(n).includes('9'));
    return n;
  }
  const hundreds = [randWith59(100,999), randWith59(100,999), 100+Math.floor(Math.random()*900)];
  const thousands= [randWith59(1000,9999),randWith59(1000,9999),1000+Math.floor(Math.random()*9000)];
  const tenthous = [randWith59(10000,99999),randWith59(10000,99999),10000+Math.floor(Math.random()*90000)];
  return shuffle([...hundreds,...thousands,...tenthous]);
}

function generateRandomNumbers(){
  const pool=[];
  for(let i=0;i<=100;i++) pool.push(i);
  const with59 = pool.filter(n=>String(n).includes('5')||String(n).includes('9'));
  const without = pool.filter(n=>!String(n).includes('5')&&!String(n).includes('9'));
  const chosen=[...shuffle(with59).slice(0,6),...shuffle(without).slice(0,5)];
  return shuffle(chosen);
}

function buildPortal(){
  const grid = document.getElementById('lessons-grid');
  grid.innerHTML = '';

  // Pinyin chart card (before D1)
  const pyCard = document.createElement('div');
  pyCard.className = 'lesson-card pinyin-card';
  pyCard.innerHTML = `<div class="d-num" style="color:var(--blue-light)">📊</div><div class="d-title" style="color:var(--text);font-weight:700">漢語拼音表<br><span style="font-size:12px;color:var(--text-muted)">點擊聽聲調</span></div>`;
  pyCard.onclick = () => openPinyinChart();
  grid.appendChild(pyCard);

  LESSONS.forEach(l => {
    const div = document.createElement('div');
    div.className = 'lesson-card' + (l.locked ? ' locked' : '');
    div.innerHTML = `<div class="d-num">${l.id}</div><div class="d-title">${l.title}<br><span style="font-size:12px;color:var(--text-muted)">${l.subtitle}</span></div>`;
    if (!l.locked) div.onclick = () => openLesson(l.id);
    grid.appendChild(div);
  });
}
function showPortal(){ clearInterval(mmInterval); showScreen('portal'); }

function openLesson(id){
  currentLesson = LESSONS.find(l => l.id === id);
  const L = currentLesson;
  document.getElementById('lh-title').innerHTML = `${L.id}<br><span>${L.title}・${L.subtitle}</span>`;
  document.getElementById('lh-info').textContent = L.info;

  const modes = document.getElementById('lh-modes');
  modes.innerHTML = '';
  const btns = [
    {icon:'🃏', name:'詞語卡',    desc:'詞語記憶卡＋發音', fn:'startFlashcards()', show: L.vocab.length > 0,   tone:false},
    {icon:'🧩', name:'配對遊戲',  desc:'中文配對練習',     fn:'startMemory()',     show: L.mmPairs.length > 0, tone:false},
    {icon:'🎵', name:'聲調＆聽寫',desc:'聲調＆數字聽寫',   fn:'startToneQuiz()',   show: L.toneData.length > 0 || L.hasNumberDictation, tone:true},
    {icon:'💬', name:'對話練習',  desc:'禮貌對話填空',     fn:'startDialogue()',   show: L.dialogueData.length > 0, tone:false},
    {icon:'🧱', name:'句子重組',  desc:'詞卡重組句子',     fn:'startSentence()',   show: L.sentenceData.length > 0, tone:false},
  ].filter(b => b.show);

  btns.forEach((b,i) => {
    const div = document.createElement('div');
    div.className = 'mode-btn' + (b.tone ? ' tone-btn' : '');
    if (btns.length % 2 === 1 && i === btns.length - 1) div.style.gridColumn = '1/-1';
    const modeIcon = b.tone
      ? `<div class="mode-icon" style="font-size:32px;margin-bottom:10px;color:var(--gold);line-height:1">♩♪</div>`
      : `<div class="mode-icon">${b.icon}</div>`;
    div.innerHTML = modeIcon + `<div class="mode-name">${b.name}</div>`;
    div.onclick = new Function(b.fn);
    modes.appendChild(div);
  });

  showScreen('lesson-home');
}

// HELPERS
// ════════════════════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function shuffle(a){ return [...a].sort(() => Math.random() - .5) }
function speak(text){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 0.45;
  window.speechSynthesis.speak(u);
}
function showResult(mode, score, total, sub){
  const pct = Math.round(score / total * 100);
  const msg = pct >= 80 ? '太棒了！🎉' : pct >= 60 ? '不錯哦！💪' : '繼續加油！📖';
  document.getElementById('res-score').textContent = score;
  document.getElementById('res-total').textContent = `/ ${total}`;
  document.getElementById('res-msg').textContent = msg;
  document.getElementById('res-sub').textContent = sub || `正確率 ${pct}%`;
  const map = { flashcards: startFlashcards, memory: startMemory, tonequiz: startToneQuiz, dialogue: startDialogue, sentence: startSentence };
  document.getElementById('res-retry').onclick = map[mode] || backToLesson;
  showScreen('result');
}

let fcIdx = 0, fcVocab = [];
function startFlashcards(){
  fcIdx = 0; fcVocab = shuffle(currentLesson.vocab);
  showScreen('flashcards'); renderFC();
}
function renderFC(){
  const v = fcVocab[fcIdx];
  document.getElementById('fc-char').textContent    = v.char;
  document.getElementById('fc-pinyin').textContent  = v.pinyin;
  document.getElementById('fc-meaning').textContent = v.meaning;
  document.getElementById('fc-example').textContent = v.example;
  document.getElementById('fc-counter').textContent = `${fcIdx+1} / ${fcVocab.length}`;
  document.getElementById('fc-progress').style.width = `${(fcIdx+1)/fcVocab.length*100}%`;
  const card = document.getElementById('fc-card');
  card.classList.remove('flipped'); card.classList.add('pop');
  setTimeout(() => card.classList.remove('pop'), 300);
  setTimeout(() => speakWord(), 500);
}
function speakWord(){
  const btn = document.getElementById('fc-sound-btn');
  btn.classList.add('playing');
  // If char is a pure number, speak the Chinese pinyin reading via the meaning field isn't great
  // Instead speak the char directly – zh-TW TTS reads arabic numerals in Chinese
  const ch = fcVocab[fcIdx].char;
  speak(ch);
  setTimeout(() => btn.classList.remove('playing'), 1400);
}
function flipCard(){ document.getElementById('fc-card').classList.toggle('flipped') }
function fcNext(){ if (fcIdx < fcVocab.length - 1){ fcIdx++; renderFC() } }
function fcPrev(){ if (fcIdx > 0){ fcIdx--; renderFC() } }

let mmFlipped=[], mmMatched=0, mmMoves=0, mmTimer=0, mmInterval=null, mmLocked=false;
function startMemory(){
  mmFlipped=[]; mmMatched=0; mmMoves=0; mmTimer=0; mmLocked=false;
  clearInterval(mmInterval); showScreen('memory');
  const tiles = [];
  currentLesson.mmPairs.forEach((p,i) => {
    tiles.push({id:i, side:'a', text:p.a, isEmoji: !!p.emoji});
    tiles.push({id:i, side:'b', text:p.b, isEmoji: false});
  });
  const grid = document.getElementById('mm-grid'); grid.innerHTML = '';
  shuffle(tiles).forEach(t => {
    const div = document.createElement('div'); div.className = 'mm-tile';
    // emoji tiles: bigger emoji
    const isEmoji = t.isEmoji;
    if(isEmoji){
      div.innerHTML = `<div class="mm-tile-inner"><div class="mm-tile-emoji">${t.text}</div></div>`;
    } else {
      div.innerHTML = `<div class="mm-tile-inner">${t.text}</div>`;
    }
    div.onclick = () => mmClick(div, t); grid.appendChild(div);
  });
  mmInterval = setInterval(() => { mmTimer++; document.getElementById('mm-timer').textContent = `⏱ ${mmTimer}s` }, 1000);
  mmUpdateStats();
}
function mmClick(div, t){
  if (mmLocked || div.classList.contains('matched') || div.classList.contains('revealed')) return;
  div.classList.add('revealed'); mmFlipped.push({div, t});
  if (mmFlipped.length === 2){
    mmMoves++; mmLocked = true;
    const [a, b] = mmFlipped;
    if (a.t.id === b.t.id && a.t.side !== b.t.side){
      a.div.classList.add('matched'); b.div.classList.add('matched');
      mmMatched++; mmFlipped = []; mmLocked = false; mmUpdateStats();
      if (mmMatched === currentLesson.mmPairs.length){ clearInterval(mmInterval); setTimeout(() => showResult('memory', currentLesson.mmPairs.length, currentLesson.mmPairs.length, `用了 ${mmMoves} 步，${mmTimer} 秒！`), 400) }
    } else {
      a.div.classList.add('wrong'); b.div.classList.add('wrong');
      setTimeout(() => { a.div.classList.remove('revealed','wrong'); b.div.classList.remove('revealed','wrong'); mmFlipped = []; mmLocked = false }, 900);
    }
    mmUpdateStats();
  }
}
function mmUpdateStats(){
  document.getElementById('mm-pairs').textContent = `配對：${mmMatched} / ${currentLesson.mmPairs.length}`;
  document.getElementById('mm-moves').textContent = `步數：${mmMoves}`;
  document.getElementById('mm-score-badge').textContent = `${mmMatched} 配對`;
}

function tqSetMode(mode){

  document.querySelectorAll('.nd-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nd-tab')[mode==='tone'?0:1].classList.add('active');
  document.getElementById('tq-tone-section').style.display   = mode==='tone'   ? 'block':'none';
  document.getElementById('tq-number-section').style.display = mode==='number' ? 'block':'none';
  if(mode==='tone') renderTQ();
  if(mode==='number') initND();
}

function renderTQ(){
  if(!tqList.length) return;
  if (tqIdx >= tqList.length){ showResult('tonequiz', tqScore, tqList.length, '聲調練習完成！'); return }
  tqSelected = null;
  const q = tqList[tqIdx];
  document.getElementById('tq-q-num').textContent = `第 ${tqIdx+1} 題 / 共 ${tqList.length} 題`;
  document.getElementById('tq-char').textContent  = q.char;
  document.getElementById('tq-progress').style.width = `${tqIdx/tqList.length*100}%`;
  document.getElementById('tq-score-badge').textContent = `${tqScore}分`;
  const submit = document.getElementById('tq-submit');
  submit.disabled = true; submit.textContent = '確認 ✓'; submit.onclick = tqSubmit;
  const grid = document.getElementById('tq-grid'); grid.innerHTML = '';
  shuffle(q.opts).forEach(opt => {
    const btn = document.createElement('button'); btn.className = 'tq-btn'; btn.textContent = opt;
    btn.onclick = () => { document.querySelectorAll('.tq-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); tqSelected = opt; submit.disabled = false };
    grid.appendChild(btn);
  });
  setTimeout(() => speak(q.char), 400);
}
function tqSubmit(){
  const q = tqList[tqIdx];
  document.querySelectorAll('.tq-btn').forEach(b => {
    b.disabled = true; b.classList.remove('selected');
    if (b.textContent === q.correct) b.classList.add('correct');
    else if (b.textContent === tqSelected && tqSelected !== q.correct) b.classList.add('wrong');
  });
  if (tqSelected === q.correct) tqScore++;
  const submit = document.getElementById('tq-submit');
  submit.textContent = '下一題 →'; submit.disabled = false;
  submit.onclick = () => { tqIdx++; submit.onclick = tqSubmit; renderTQ() };
}

// ── NUMBER DICTATION ──
let ndList=[], ndIdx=0, ndRevealed=false, ndIsFirstRun=true;

function buildNDList(isFirst){
  const items=[];
  const isD4 = currentLesson && currentLesson.id==='D4';
  if(isD4){
    // D4: 百/千/萬 大數字
    generateD4BigNumbers().forEach(n=>items.push({type:'num',value:n}));
    return items;
  }
  // D3: 原邏輯
  if(isFirst){
    D3_FIXED_NUMBERS.forEach(n => items.push({type:'num', value:n}));
    D3_FIXED_PHONES.forEach(p => items.push({type:'phone', value:p}));
  } else {
    generateRandomNumbers().forEach(n => items.push({type:'num', value:n}));
    const phones=[
      '090-'+Math.floor(10000000+Math.random()*89999999),
      '080-'+Math.floor(10000000+Math.random()*89999999),
      '03-'+Math.floor(10000000+Math.random()*89999999),
    ];
    phones.forEach(p=>items.push({type:'phone',value:p}));
  }
  return items;
}

function initND(){
  ndIsFirstRun = (d3PlayCount === 0);
  ndList = buildNDList(ndIsFirstRun);
  ndIdx=0; ndRevealed=false;
  renderND();
}

function renderND(){
  const item = ndList[ndIdx];
  ndRevealed=false;
  document.getElementById('nd-counter').textContent=`第 ${ndIdx+1} 題 / 共 ${ndList.length} 題`;
  document.getElementById('nd-question').textContent='（　？　）';
  document.getElementById('nd-hint').textContent='🔊 點擊播放';
  document.getElementById('nd-answer').style.display='none';
  document.getElementById('nd-pinyin').style.display='none';
  document.getElementById('nd-card').style.cursor='pointer';
  // auto play
  setTimeout(()=>ndSpeak(),400);
}

function ndSpeak(){
  const item=ndList[ndIdx];
  const btn=document.getElementById('nd-sound-btn');
  btn.classList.add('playing');
  let txt='';
  if(item.type==='num') txt=numToCharFixed(item.value);
  else txt=item.value.replace(/-/g,' ');
  speak(txt);
  setTimeout(()=>btn.classList.remove('playing'),1800);
}

function ndReveal(){
  if(ndRevealed) return;
  ndRevealed=true;
  const item=ndList[ndIdx];
  const ansEl=document.getElementById('nd-answer');
  const pyEl=document.getElementById('nd-pinyin');
  let ansText='', pyText='';
  if(item.type==='num'){
    ansText=String(item.value);
    pyText=numToCharFixed(item.value)+'　'+numToPinyin(item.value);
  } else {
    ansText=item.value;
    pyText=phoneDigitsToPinyin(item.value);
  }
  ansEl.textContent=ansText; ansEl.style.display='block';
  pyEl.textContent=pyText;  pyEl.style.display='block';
  document.getElementById('nd-question').textContent='答案：';
  document.getElementById('nd-hint').textContent='點擊卡片可繼續';
  document.getElementById('nd-card').style.cursor='default';
}

function ndNext(){
  if(ndIdx < ndList.length-1){ ndIdx++; renderND(); }
  else {
    d3PlayCount++;
    // finished – rebuild with random for next time
    alert('🎉 聽寫完成！再試一次會出現隨機數字。');
    ndIsFirstRun=false;
    ndList=buildNDList(false);
    ndIdx=0; renderND();
  }
}
function ndPrev(){ if(ndIdx>0){ ndIdx--; renderND(); } }

let s2Idx=0, s2Score=0, s2Answered=false, s2Selected=[], s2Current=null;
function startSentence(){ s2Idx=0; s2Score=0; showScreen('sentence'); renderS2() }
function renderS2(){
  if (s2Idx >= currentLesson.sentenceData.length){ showResult('sentence', s2Score, currentLesson.sentenceData.length, '重組全部完成！'); return }
  s2Answered=false; s2Selected=[]; s2Current=currentLesson.sentenceData[s2Idx];
  document.getElementById('s2-q-num').textContent = `第 ${s2Idx+1} 題 / 共 ${currentLesson.sentenceData.length} 題`;
  document.getElementById('s2-prompt').textContent = s2Current.prompt;
  document.getElementById('s2-score-badge').textContent = `${s2Score} / ${s2Idx}`;
  const fb = document.getElementById('s2-feedback'); fb.style.display='none'; fb.className='s2-feedback';
  const shuffled = shuffle(s2Current.tiles.map((t,i) => ({...t, idx:i})));
  const bank = document.getElementById('s2-bank'); bank.innerHTML='';
  shuffled.forEach(t => {
    const div = document.createElement('div'); div.className='s2-bank-tile';
    div.innerHTML = `<div class="tile-cn">${t.cn}</div>${t.py ? `<div class="tile-py">${t.py}</div>` : ''}`;
    div.onclick = () => s2Pick(div, t); bank.appendChild(div);
  });
  document.getElementById('s2-answer').innerHTML = '';
  document.getElementById('s2-answer').className = 's2-answer-area';
}
function s2Pick(div, t){
  if (s2Answered) return;
  div.classList.add('used'); s2Selected.push(t);
  const area = document.getElementById('s2-answer'); area.classList.add('has-content');
  const tile = document.createElement('div'); tile.className='s2-tile pop';
  tile.innerHTML = `<div class="tile-cn">${t.cn}</div>${t.py ? `<div class="tile-py">${t.py}</div>` : ''}`;
  tile.onclick = () => { s2Selected=s2Selected.filter(s=>s.idx!==t.idx); div.classList.remove('used'); tile.remove(); if(!s2Selected.length) area.classList.remove('has-content') };
  area.appendChild(tile);
}
function s2Clear(){
  s2Selected=[];
  document.getElementById('s2-answer').innerHTML='';
  document.getElementById('s2-answer').className='s2-answer-area';
  document.querySelectorAll('.s2-bank-tile').forEach(b => b.classList.remove('used'));
}
function s2Check(){
  if (s2Answered || !s2Selected.length) return;
  s2Answered = true;
  const ans = s2Selected.map(s => s.cn).join('');
  const fb = document.getElementById('s2-feedback'); fb.style.display='block';
  if (ans === s2Current.answer){
    s2Score++; fb.className='s2-feedback correct';
    fb.innerHTML=`✓ 正確！<br><small>${s2Current.answer}</small>`;
    speak(s2Current.answer);
  } else {
    fb.className='s2-feedback wrong';
    fb.innerHTML=`✗ 再想想！正確答案：<br><strong>${s2Current.answer}</strong>`;
  }
  setTimeout(() => { s2Idx++; renderS2() }, 2200);
}

const PY_VALID = {

};

// For display: when initial is '', the syllable is displayed differently
const STANDALONE_MAP = {
  'a':'a','o':'o','e':'e','i':'yi','u':'wu','ü':'yu',
  'ai':'ai','ei':'ei','ao':'ao','ou':'ou',
  'an':'an','en':'en','ang':'ang','eng':'eng','er':'er',
  'ia':'ya','iao':'yao','ie':'ye','iu':'you','ian':'yan','in':'yin','iang':'yang','ing':'ying','iong':'yong',
  'ua':'wa','uo':'wo','uai':'wai','ui':'wei','uan':'wan','un':'wen','uang':'wang','ueng':'weng',
  'üe':'yue','üan':'yuan','ün':'yun',
};

function getSyllable(initial, final){
  if(!initial) return STANDALONE_MAP[final] || final;
  // ü after j,q,x → u in writing
  let f = final;
  if(['j','q','x'].includes(initial) && (f==='ü' || f==='üe'||f==='üan'||f==='ün')){
    f = f.replace('ü','u');
  }
  return initial+f;
}

const TONES_MAP = {
  'a':['ā','á','ǎ','à'],'o':['ō','ó','ǒ','ò'],'e':['ē','é','ě','è'],
  'i':['ī','í','ǐ','ì'],'u':['ū','ú','ǔ','ù'],'ü':['ǖ','ǘ','ǚ','ǜ'],
};
function applyTone(syllable, tone){
  // tone 0 = neutral (no mark)
  if(tone===0) return syllable;
  // find the main vowel to apply tone mark
  const order=['a','o','e','ü','u','i'];
  for(const v of order){
    if(syllable.includes(v)){
      const marks = TONES_MAP[v];
      if(!marks) return syllable;
      return syllable.replace(v, marks[tone-1]);
    }
  }
  return syllable;
}

function buildPinyinChart(){
  const container = document.getElementById('py-chart-container');
  // Build a simplified grid: rows = finals groupings, cols = subset of initials
  // Use a more compact layout: group finals, show only relevant initials

  const COLS = ['','b','p','m','f','d','t','n','l','g','k','h','j','q','x','z','c','s','zh','ch','sh','r'];
  const ROWS = [
    {label:'a', finals:['a','o','e','i','u','ü']},
    {label:'ai/ei', finals:['ai','ei','ao','ou']},
    {label:'an/en', finals:['an','en','ang','eng','er']},
    {label:'ia', finals:['ia','iao','ie','iu','ian','in','iang','ing','iong']},
    {label:'ua', finals:['ua','uo','uai','ui','uan','un','uang']},
    {label:'ü', finals:['üe','üan','ün']},
  ];

  let html = `<table class="py-table"><thead><tr><th></th>`;
  COLS.forEach(c => html+=`<th>${c||'（单独）'}</th>`);
  html+='</tr></thead><tbody>';

  ROWS.forEach(group => {
    group.finals.forEach(final => {
      html+=`<tr><td style="font-weight:600;color:var(--gold);font-size:12px">${final}</td>`;
      COLS.forEach(initial => {
        const valid = PY_VALID[final] && PY_VALID[final].includes(initial);
        if(valid){
          const syl = getSyllable(initial, final);
          html+=`<td class="py-cell" onclick="openTonePopup('${syl}','${initial}','${final}')">${syl}</td>`;
        } else {
          html+=`<td class="py-cell empty">·</td>`;
        }
      });
      html+='</tr>';
    });
  });
  html+='</tbody></table>';
  container.innerHTML=html;
}

function openTonePopup(syl, initial, final){
  const popup = document.getElementById('tone-popup');
  document.getElementById('tp-syllable').textContent = syl;
  const row = document.getElementById('tp-tones');
  row.innerHTML='';
  // neutral tone
  const neutral = document.createElement('button');
  neutral.className='tone-pill'; neutral.textContent=syl;
  neutral.title='輕聲（neutral）';
  neutral.onclick=()=>{ speak(syl); };
  row.appendChild(neutral);
  // tones 1–4
  [1,2,3,4].forEach(t=>{
    const btn=document.createElement('button');
    btn.className='tone-pill';
    const toned=applyTone(syl,t);
    btn.textContent=toned;
    btn.onclick=()=>{ speak(toned); };
    row.appendChild(btn);
  });
  // position popup
  popup.style.display='block';
  popup.style.left='50%'; popup.style.top='50%';
  popup.style.transform='translate(-50%,-50%)';
}
function closeTonePopup(){ document.getElementById('tone-popup').style.display='none'; }
// Close popup on outside click
document.addEventListener('click',e=>{

  if(p && p.style.display==='block' && !p.contains(e.target) && !e.target.classList.contains('py-cell')){
    p.style.display='none';

});
